name: APK Android — DEMO commerciale

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo-apk:
    name: Construire l'APK DEMO isolé
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
      DEMO_BUILD: 'true'
      NODE_ENV: production
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Restaurer les sources de l'application depuis l'archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="KinMarche-DEMO-source-prepare.zip"
          test -f "$ARCHIVE" || { echo "::error::Archive source absente: $ARCHIVE"; exit 1; }
          mkdir -p .demo-extract
          unzip -oq "$ARCHIVE" -d .demo-extract

          MOBILE_PACKAGE="$(find .demo-extract -type f -path '*/apps/mobile/package.json' -print -quit)"
          if [ -z "$MOBILE_PACKAGE" ]; then
            echo "::error::Le ZIP ne contient pas apps/mobile/package.json."
            echo "Fichiers package.json présents dans l'archive :"
            find .demo-extract -name package.json -print | head -50
            exit 1
          fi

          SOURCE_ROOT="${MOBILE_PACKAGE%/apps/mobile/package.json}"
          echo "Racine des sources détectée : $SOURCE_ROOT"
          cp -a "$SOURCE_ROOT"/. .

          test -f apps/mobile/package.json || { echo "::error::apps/mobile/package.json absent après extraction"; exit 1; }
          test -d supabase/migrations || { echo "::error::supabase/migrations absent après extraction"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier les secrets du backend DEMO
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "DEMO_SUPABASE_URL manquant" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || (echo "DEMO_SUPABASE_ANON_KEY manquant" && exit 1)
          test "$EXPO_PUBLIC_SUPABASE_URL" = "https://jshkcaunoxjnybnvausk.supabase.co" || (echo "URL non conforme au projet Kin-marche-demo" && exit 1)

      - name: Vérifier les secrets Supabase DEMO et préparer le schéma
        working-directory: .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEMO_DB_PASSWORD: ${{ secrets.DEMO_SUPABASE_DB_PASSWORD }}
          DEMO_URL: ${{ secrets.DEMO_SUPABASE_URL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN manquant" && exit 1)
          test -n "$DEMO_DB_PASSWORD" || (echo "DEMO_SUPABASE_DB_PASSWORD manquant" && exit 1)
          test "$DEMO_URL" = "https://jshkcaunoxjnybnvausk.supabase.co" || (echo "URL non conforme au projet Kin-marche-demo" && exit 1)
          npx --yes supabase@latest link --project-ref jshkcaunoxjnybnvausk --password "$DEMO_DB_PASSWORD"
          npx --yes supabase@latest db push --linked --yes

      - name: Vérifier le backend DEMO
        working-directory: .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest db lint --linked --fail-on error

      - name: Installer les dépendances
        working-directory: .
        run: cd apps/mobile && npm install --no-audit --no-fund && npx expo install --fix

      - name: Générer le projet Android natif
        working-directory: .
        run: cd apps/mobile && npx expo prebuild --platform android --no-install

      - name: Compiler l'APK DEMO
        working-directory: .
        run: cd apps/mobile/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        working-directory: .
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "KinMarche-DEMO-${{ github.run_number }}.apk"

      - name: Publier une Release DEMO
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="demo-${{ github.run_number }}"
          gh release create "$TAG" "KinMarche-DEMO-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Kin Marché — DEMO commerciale n°${{ github.run_number }}" \
            --notes "APK de démonstration isolé. Aucun paiement réel n'est activé."
            
